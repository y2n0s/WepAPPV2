<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#3E1F47">
    <meta name="author" content="يونس البحر / Younes AL-Bahar">
    <title>شركة جدة الرائدة | منتجات العناية والتجميل بالجملة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link
      rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"
      rel="stylesheet">
    <style>
:root{--plum:#3E1F47;--blush:#F7ECEF;--gold:#B7862F;--ink:#2A2230;--line:#E6D9DE;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);background:var(--blush);padding-bottom:84px}
header{background:var(--plum);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;font-weight:700;flex:1;min-width:150px}
header small{display:block;font-weight:400;font-size:12px;opacity:.8}
button,select,input{font:inherit}
.lang{background:none;border:1px solid #fff8;color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;position:sticky;top:0;background:var(--blush);z-index:5;border-bottom:1px solid var(--line)}
.bar input,.bar select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:150px;flex:1}
.bar input:focus,.bar select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:contain;background:#fff}
.ph{display:grid;place-items:center;color:var(--line);font-size:38px}
.cb{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.brand{color:var(--gold);font-weight:600;font-size:13px}
.nm{font-weight:600;font-size:15px;line-height:1.4}
.bc{direction:ltr;width:100%;height:auto;margin-top:auto;cursor:zoom-in;background:#fff}
#bd svg{width:100%;height:auto;direction:ltr;display:block}
.add{background:var(--plum);color:#fff;border:0;padding:10px;cursor:pointer;font-weight:600}
.add.in{background:var(--gold)}
.msg{grid-column:1/-1;text-align:center;padding:40px;color:#6b5b70}
#fab{position:fixed;inset-inline:18px;bottom:16px;background:var(--gold);color:#fff;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 6px 18px #3E1F4755}
#fab[hidden]{display:none}
dialog{border:0;border-radius:14px;padding:0;width:min(560px,94vw);max-height:90vh}
dialog::backdrop{background:#2A223088}
.dh{padding:14px 18px;background:var(--plum);color:#fff;display:flex;justify-content:space-between;align-items:center}
.dh button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.items{padding:6px 18px;max-height:38vh;overflow:auto}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.it span{flex:1;font-size:14px}
.it input{width:64px;padding:6px;border:1px solid var(--line);border-radius:6px;text-align:center}
.it button{background:none;border:0;color:#a33;cursor:pointer;font-size:18px}
.form{padding:14px 18px;display:grid;gap:10px}
.form input{padding:10px;border:1px solid var(--line);border-radius:8px}
.send{background:#1f8f4e;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:700;cursor:pointer}
.bc:not([viewBox]){height:90px}
.more{grid-column:1/-1;background:#fff;border:1px solid var(--plum);color:var(--plum);border-radius:8px;padding:12px;font-weight:600;cursor:pointer}
.scan{background:var(--plum);color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}
#rd{width:100%;min-height:240px;background:#000}
#rm{padding:12px 18px;text-align:center;font-size:14px}
.credit{text-align:center;padding:22px 18px 6px;font-size:13px;color:#6b5b70}
.credit b{color:var(--plum)}
@media (prefers-reduced-motion:no-preference){.add{transition:background .15s}}
</style>
  </head>
  <body>
    <header>
      <h1>شركة جدة الرائدة<small id="sub"></small></h1>
      <button class="lang" id="lg"></button>
    </header>
    <div class="bar">
      <input id="q" type="search">
      <button class="scan" id="scan" hidden></button>
      <select id="fc"></select>
      <select id="fb"></select>
      <small id="hint" style="flex-basis:100%;color:#6b5b70"></small>
    </div>
    <main id="grid"></main>
    <footer class="credit" id="cr"></footer>
    <button id="fab" hidden></button>

    <dialog id="dlg">
      <div class="dh"><b id="dt"></b><button id="cl"
          aria-label="close">×</button></div>
      <div class="items" id="items"></div>
      <div class="form">
        <input id="n1"><input id="n2"><input id="n3" type="tel">
        <button class="send" id="sd"></button>
      </div>
    </dialog>

    <dialog id="cam"><div class="dh"><b id="ct"></b><button id="cx"
          aria-label="close">×</button></div><div id="rd"></div><p
        id="rm"></p></dialog>

    <dialog id="bd"><div class="dh"><b id="bn"></b><button id="bx"
          aria-label="close">×</button></div><div
        style="padding:18px;background:#fff"><svg id="bb"></svg></div></dialog>

    <script
      src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script>
// ===== الإعدادات =====
const API='https://script.google.com/macros/s/AKfycbw9eTcGMp7MyLTrRdzr_86tLuNCPBZQ5DHCVZQLyjday8cCdncijRUWz5R9wQf00fl7/exec';
const WA='966115110811';
// =====================
const T={
ar:{sub:'منصة الجملة لمنتجات العناية والتجميل',q:'ابحث بالاسم أو الباركود',ac:'كل التصنيفات',ab:'كل الماركات',add:'أضف للطلب',in:'في الطلب ✓',fab:'طلب عرض سعر',empty:'لا توجد منتجات مطابقة للبحث',fail:'تعذر تحميل المنتجات. تحقق من الاتصال وأعد المحاولة.',load:'جاري التحميل...',n1:'الاسم',n2:'الشركة / المتجر',n3:'رقم الجوال',send:'أرسل الطلب عبر واتساب',none:'اختر منتجات لتبدأ طلبك',lang:'English',msg:'السلام عليكم، أرغب في عرض سعر للمنتجات المرفقة في ملف Excel.',pc:' منتج',more:'عرض المزيد',credit:'شركة جدة الرائدة · تصميم وبرمجة: <b>يونس البحر</b>',libfail:'تعذر تحميل أداة الإرسال. تحقق من الاتصال وأعد المحاولة.',scan:'مسح باركود',scanTip:'وجّه الكاميرا نحو الباركود',camErr:'تعذر تشغيل الكاميرا. اسمح للمتصفح باستخدام الكاميرا ثم أعد المحاولة.',zoom:'اضغط على أي باركود لتكبيره وقراءته بالقارئ'},
en:{sub:'Wholesale skincare & beauty',q:'Search by name or barcode',ac:'All categories',ab:'All brands',add:'Add to request',in:'In request ✓',fab:'Request a quote',empty:'No products match your search',fail:'Could not load products. Check your connection and try again.',load:'Loading...',n1:'Name',n2:'Company / store',n3:'Mobile number',send:'Send request via WhatsApp',none:'Pick products to start your request',lang:'العربية',msg:'Hello, I would like a price quote for the products in the attached Excel file.',pc:' items',more:'Show more',credit:'Jadda Al-Raida Co. · Design &amp; development: <b>Younes AL-Bahar</b>',libfail:'Could not load the export tool. Check your connection and try again.',scan:'Scan barcode',scanTip:'Point the camera at the barcode',camErr:'Could not start the camera. Allow camera access in your browser and try again.',zoom:'Tap any barcode to enlarge it for scanning'}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let L=store.get('lang','ar'),P=[],cart=store.get('cart',{}),shown=48;
const t=k=>T[L][k];
const libs={};
const lib=(u,g)=>window[g]?Promise.resolve():(libs[u]=libs[u]||new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>{delete libs[u];no(new Error('load'))};document.head.appendChild(e)}));
const XL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',QR='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
const pick=(p,k)=>(L==='ar'?p[k+'_ar']||p[k+'_en']:p[k+'_en']||p[k+'_ar'])||'';
const nm=p=>pick(p,'name');

function ui(){
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  $('sub').textContent=t('sub');$('q').placeholder=t('q');$('hint').textContent=t('zoom');$('cr').innerHTML='© '+new Date().getFullYear()+' '+t('credit');$('scan').textContent='📷 '+t('scan');$('ct').textContent=t('scan');$('lg').textContent=t('lang');
  $('dt').textContent=t('fab');$('n1').placeholder=t('n1');$('n2').placeholder=t('n2');$('n3').placeholder=t('n3');$('sd').textContent=t('send');
  const keep=[$('fc').value,$('fb').value];
  fill('fc',t('ac'),'category',keep[0]);fill('fb',t('ab'),'brand',keep[1]);
  show();cartUI();
}
const key=(p,k)=>p[k+'_ar']||p[k+'_en']||'';
function fill(id,all,k,cur){
  const m=new Map();P.forEach(p=>{if(key(p,k))m.set(key(p,k),pick(p,k))});
  const u=[...m].sort((a,b)=>a[1].localeCompare(b[1],L));
  $(id).innerHTML=`<option value="">${all}</option>`+u.map(([v,l])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`).join('');
}
const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);bar(e.target,e.target.dataset.c,2,60)}}),{rootMargin:'300px'}):null;
const mio='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){mio.disconnect();shown+=48;show()}}),{rootMargin:'500px'}):null;
function show(){
  const q=$('q').value.trim().toLowerCase(),c=$('fc').value,b=$('fb').value;
  const list=P.filter(p=>(!c||key(p,'category')===c)&&(!b||key(p,'brand')===b)&&(!q||(p.name_ar+' '+p.name_en+' '+p.brand_ar+' '+p.brand_en+' '+p.barcode).toLowerCase().includes(q)));
  $('grid').innerHTML=list.length?list.slice(0,shown).map(p=>`<article class="card">${p.image?`<img loading="lazy" decoding="async" src="${esc(p.image)}" alt="${esc(nm(p))}">`:'<div class="ph">✦</div>'}
  <div class="cb"><span class="brand">${esc(pick(p,'brand'))}</span><span class="nm">${esc(nm(p))}</span>
  ${p.barcode?`<svg class="bc" data-c="${esc(p.barcode)}"></svg>`:''}</div>
  <button class="add${cart[p.id]?' in':''}" data-id="${esc(p.id)}">${cart[p.id]?t('in'):t('add')}</button></article>`).join('')+(list.length>shown?`<button class="more" id="more">${t('more')} (${list.length-shown})</button>`:''):`<p class="msg">${t('empty')}</p>`;
  document.querySelectorAll('svg.bc').forEach(x=>io?io.observe(x):bar(x,x.dataset.c,2,60));
  const mb=$('more');if(mb&&mio)mio.observe(mb);
}
// يرسم الباركود بصيغته الأصلية (EAN-13/UPC/EAN-8) أو Code128، مع هامش أبيض كافٍ يطلبه القارئ
function bar(s,c,w,h){
  const f=/^\d{13}$/.test(c)?'EAN13':/^\d{12}$/.test(c)?'UPC':/^\d{8}$/.test(c)?'EAN8':'CODE128';
  const o={height:h,width:w,fontSize:14,margin:14,background:'#fff',lineColor:'#000',textMargin:2};
  try{JsBarcode(s,c,{...o,format:f})}catch(e){try{JsBarcode(s,c,{...o,format:'CODE128'})}catch(e2){s.setAttribute('viewBox','0 0 220 34');s.innerHTML='<text x="110" y="23" text-anchor="middle" font-size="16" font-family="monospace">'+esc(c)+'</text>';return}}
  if(!s.getAttribute('viewBox'))s.setAttribute('viewBox',`0 0 ${parseFloat(s.getAttribute('width'))} ${parseFloat(s.getAttribute('height'))}`);
}
function cartUI(){
  const n=Object.keys(cart).length;
  $('fab').hidden=!n;$('fab').textContent=`${t('fab')} (${n}${t('pc')})`;
  $('items').innerHTML=n?P.filter(p=>cart[p.id]).map(p=>`<div class="it"><span>${esc(nm(p))}<br><small>${esc(pick(p,'brand'))}</small></span><input type="number" min="1" value="${cart[p.id]}" data-q="${esc(p.id)}"><button data-rm="${esc(p.id)}" aria-label="remove">✕</button></div>`).join(''):`<p class="msg">${t('none')}</p>`;
  if(!n&&$('dlg').open)$('dlg').close();
}
function save(){store.set('cart',cart);show();cartUI()}

$('grid').onclick=e=>{
  if(e.target.id==='more'){shown+=48;show();return}
  const bc=e.target.closest('svg.bc');
  if(bc){const p=P.find(x=>x.barcode===bc.dataset.c);$('bn').textContent=p?nm(p):'';bar($('bb'),bc.dataset.c,3,130);$('bd').showModal();return}
  const id=e.target.dataset.id;if(!id)return;if(cart[id])delete cart[id];else cart[id]=1;save()};
$('items').onclick=e=>{const id=e.target.dataset.rm;if(id){delete cart[id];save()}};
$('items').onchange=e=>{const id=e.target.dataset.q;if(id){cart[id]=Math.max(1,parseInt(e.target.value)||1);store.set('cart',cart)}};
$('fab').onclick=()=>{$('dlg').showModal();lib(XL,'XLSX').catch(()=>{})};$('cl').onclick=()=>$('dlg').close();$('bx').onclick=()=>$('bd').close();
let dt;$('q').oninput=()=>{clearTimeout(dt);dt=setTimeout(()=>{shown=48;show()},180)};
['fc','fb'].forEach(i=>$(i).onchange=()=>{shown=48;show()});
$('lg').onclick=()=>{L=L==='ar'?'en':'ar';store.set('lang',L);ui()};
['n1','n2','n3'].forEach(i=>{$(i).value=store.get(i,'');$(i).onchange=()=>store.set(i,$(i).value)});

$('sd').onclick=async()=>{
  const items=P.filter(p=>cart[p.id]);if(!items.length)return;
  try{await lib(XL,'XLSX')}catch(e){return alert(t('libfail'))}
  const rows=items.map((p,i)=>({'#':i+1,'الباركود / Barcode':String(p.barcode||''),'الماركة':p.brand_ar,'Brand':p.brand_en,'المنتج':p.name_ar,'Product':p.name_en,'الكمية / Qty':cart[p.id]}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Quote');
  const file=new File([XLSX.write(wb,{type:'array',bookType:'xlsx'})],'quote-request.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const msg=`${t('msg')}\n${t('n1')}: ${$('n1').value}\n${t('n2')}: ${$('n2').value}\n${t('n3')}: ${$('n3').value}`;
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],text:msg});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');
};

// ===== مسح الباركود بالكاميرا (آيفون وأندرويد) =====
let sc=null,done=false,busy=Promise.resolve();
const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(/Mac/.test(navigator.platform)&&navigator.maxTouchPoints>1);
if(mobile&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)$('scan').hidden=false;
// تشغيل وإيقاف الكاميرا بالتسلسل حتى لا يتعارض الإيقاف مع التشغيل التالي
const stopScan=()=>{busy=busy.then(async()=>{const x=sc;sc=null;if(x){try{await x.stop()}catch(e){}try{x.clear()}catch(e){}}$('rd').innerHTML=''}).catch(()=>{})};
async function startScan(){
  done=false;$('rm').textContent=t('scanTip');
  if(!$('cam').open)$('cam').showModal();
  try{
    await lib(QR,'Html5Qrcode');
    if(!$('cam').open)return;
    const F=Html5QrcodeSupportedFormats;
    const x=new Html5Qrcode('rd',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39],verbose:false,useBarCodeDetectorIfSupported:true});
    sc=x;
    await x.start({facingMode:'environment'},{fps:15,qrbox:(w,h)=>({width:Math.floor(w*.9),height:Math.min(150,h)})},code=>{
      if(done)return;done=true;
      const z=v=>String(v).replace(/^0+/,'');
      const m=P.find(p=>p.barcode===code)||P.find(p=>p.barcode&&z(p.barcode)===z(code));
      $('q').value=m?m.barcode:code;$('fc').value='';$('fb').value='';shown=48;
      $('cam').close();show();window.scrollTo({top:0,behavior:'smooth'});
    },()=>{});
  }catch(e){sc=null;$('rm').textContent=t('camErr')}
}
$('scan').onclick=()=>{busy=busy.then(startScan).catch(()=>{})};
$('cx').onclick=()=>$('cam').close();
$('cam').onclose=stopScan;

async function load(){
  P=store.get('cache',[]);ui();
  if(!P.length)$('grid').innerHTML=`<p class="msg">${t('load')}</p>`;
  try{
    const r=await fetch(API);const d=await r.json();
    const n=(d.products||[]).filter(p=>p.id&&String(p.active).toLowerCase()!=='false').map(p=>({...p,id:String(p.id),barcode:String(p.barcode||'')}));
    if(P.length&&JSON.stringify(n)===JSON.stringify(P))return;
    P=n;store.set('cache',P);
  }catch(e){if(!P.length){$('grid').innerHTML=`<p class="msg">${t('fail')}</p>`;return}}
  ui();
}
load();
</script>
  </body>
</html>
